<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guesting Books</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Guestbook</h1>
  </header>
  
  <div>
    <form className="guestbook" action="/guestbook" method="POST">
      <label for="name">Sign the Guestbook:</label>
      <input type="text" id="name" name="name" placeholder="Name" />
      <button type="submit">Sign Guestbook</button>
    </form>
    
    <ul>
      {% for item in guestbook %}
        <li>{{ item }}</li>
      {% endfor %}
    </ul>

  </div>

  <footer>
  </footer>
</body>
</html>
